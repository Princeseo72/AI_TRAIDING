plugins { id 'com.android.application' }

android {
    namespace 'com.kplay.horseracing.gumvit'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kplay.horseracing.crosspool.v23'
        minSdk 23
        targetSdk 35
        versionCode 23
        versionName '2.3.0'
    }
}

def pegasusBase64 = ''

tasks.register('preparePegasusAssets') {
    doLast {
        byte[] data = java.util.Base64.getDecoder().decode(pegasusBase64)
        [
            file('src/main/res/drawable-nodpi/pegasus_intro_logo.jpg'),
            file('src/main/res/mipmap-nodpi/ic_launcher_pegasus.jpg')
        ].each { f ->
            f.parentFile.mkdirs()
            f.bytes = data
        }
    }
}

tasks.named('preBuild').configure { dependsOn('preparePegasusAssets') }

dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
}
