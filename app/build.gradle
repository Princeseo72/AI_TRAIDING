plugins { id 'com.android.application' }

android {
    namespace 'com.kplay.horseracing.gumvit'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kplay.horseracing.crosspool.v24'
        minSdk 23
        targetSdk 35
        versionCode 24
        versionName '2.4.0'
    }
}

def launcherBase64 = ''

def introBase64 = '[TRUNCATED_FOR_TOOL]'

tasks.register('preparePegasusAssets') {
    doLast {
        def decoder = java.util.Base64.getDecoder()
        def intro = file('src/main/res/drawable-nodpi/pegasus_intro_logo.jpg')
        def launcher = file('src/main/res/mipmap-nodpi/ic_launcher_pegasus.jpg')
        intro.parentFile.mkdirs(); launcher.parentFile.mkdirs()
        intro.bytes = decoder.decode(introBase64)
        launcher.bytes = decoder.decode(launcherBase64)
    }
}

tasks.named('preBuild').configure { dependsOn('preparePegasusAssets') }

dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
}
