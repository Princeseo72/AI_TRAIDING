name: Package HIST Source
on:
  push:
    branches: [ package-hist-d6ecb274 ]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact HIST commit
        run: |
          git archive --format=zip --output=PEGASUS-HIST-full-source-v4.3.0-final.zip 5669ace4665b7634d43a45dc8317ec6ea301c6a7
      - uses: actions/upload-artifact@v4
        with:
          name: PEGASUS-HIST-full-source-v4.3.0-final
          path: PEGASUS-HIST-full-source-v4.3.0-final.zip
          if-no-files-found: error
