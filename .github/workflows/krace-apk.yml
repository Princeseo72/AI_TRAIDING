name: KRace Android APK
on:
  push:
    branches: [krace-analyzer-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: krace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        run: gradle :app:assembleDebug --stacktrace
      - name: APK verify
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          echo 'APK archive verified'
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KRaceAnalyzer-Android-APK
          path: krace/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
