name: Build Android APK

on:
  push:
    branches: [ main, pegasus-v6-hist, pegasus-v4.3.0-hist-release ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses and install SDK 35
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -o pipefail
          node --check app/src/main/assets/app.js 2>&1 | tee js-syntax.log
          node --check app/src/main/assets/analysis.js 2>&1 | tee -a js-syntax.log
          node --check app/src/main/assets/pegasus-engine.js 2>&1 | tee -a js-syntax.log
          node --check app/src/main/assets/ml.js 2>&1 | tee -a js-syntax.log

      - name: Upload JavaScript syntax diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-syntax-diagnostic
          path: js-syntax.log

      - name: Integrated HIST collector contract gate
        run: |
          grep -R "ScoretableDetailList.do" app/src/main/java/com/kplay/horseracing/HistKraHistorySource.java
          grep -R "startIntegratedCollection" app/src/main/java/com/kplay/horseracing/HistBridge.java
          grep -R "stopIntegratedCollection" app/src/main/java/com/kplay/horseracing/HistBridge.java
          grep -R "installCollectedAndTrainAsync" app/src/main/java/com/kplay/horseracing/HistBridge.java
          grep -R "FAILED_SKIPPED" app/src/main/java/com/kplay/horseracing/HistCollectorService.java
          grep -R "5년 HIST 수집/이어받기" app/src/main/assets/app.js
          grep -R "구형 수집기 연결" app/src/main/assets/app.js

      - name: Run analysis and exclusion tests
        run: node test-analysis.js && node test-exclusion.js

      - name: Run race parser deterministic tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests com.kplay.horseracing.gumvit.ScratchDetectorTest --tests com.kplay.horseracing.gumvit.GumvitPageParserTest --tests com.kplay.horseracing.gumvit.KraRaceParserTest 2>&1 | tee parser-tests.log

      - name: Upload parser diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-tests-diagnostic
          path: parser-tests.log

      - name: Run dual-source live diagnostic (blocking)
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.kplay.horseracing.gumvit.DualSourceLiveSmokeTest

      - name: Run excluded-runner JS boundary tests
        run: node test-runner-guard.js

      - name: Run ML engine and schema tests
        shell: bash
        run: |
          set -o pipefail
          (node test-ml.js && node test-ml-schema.js && node test-result-learning.js && node test-learning-runtime.js && node test-fix-contract.js) 2>&1 | tee ml-tests.log

      - name: Upload ML diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-tests-diagnostic
          path: ml-tests.log

      - name: Run UI menu and performance tests
        run: node test-menu.js && node test-ml-ui.js && node test-performance-contract.js && node test-performance-runtime.js && node test-network-resilience.js && node test-final-design-phase1.js && node test-pegasus-final-engine.js && node test-pegasus-app-integration.js && node test-pegasus-closed-loop.js && node test-all-go.js

      - name: Run integrity and branding tests
        run: node test-integrity.js && node test-branding.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package and Android 10 compatibility
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          MINSDK=$($ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest min-sdk "$APK")
          APPID=$($ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest application-id "$APK")
          echo "minSdk=$MINSDK applicationId=$APPID"
          test "$MINSDK" -le 29
          test "$APPID" = "com.kplay.horseracing.crosspool.v600"
          ls -lh "$APK"

      - name: Name release APK
        shell: bash
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Pegasus V6.0.0.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pegasus-V6.0.0
          path: "app/build/outputs/apk/debug/Pegasus V6.0.0.apk"
          if-no-files-found: error
