name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses and install SDK 35
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run analysis tests
        run: node test-analysis.js

      - name: Run v2.4 branding and tablet tests
        run: node test-branding.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package and Android 10 compatibility
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          MINSDK=$($ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest min-sdk "$APK")
          APPID=$($ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest application-id "$APK")
          echo "minSdk=$MINSDK applicationId=$APPID"
          test "$MINSDK" -le 29
          test "$APPID" = "com.kplay.horseracing.crosspool.v24"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HorseRacingOddsAnalyzer-v2.4.0-Pegasus
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
