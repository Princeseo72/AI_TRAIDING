name: Hist Collector Android
on:
  push:
    branches: [ hist-collector-v1 ]
    paths: [ 'collector/**', '.github/workflows/hist-collector-build.yml' ]
  workflow_dispatch:
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - uses: android-actions/setup-android@v3
   - uses: gradle/actions/setup-gradle@v4
   - name: Contract tests
     run: |
       grep -R "PEGASUS_HIST_V1" collector/app/src/main/java
       grep -R "BUSAN_GYEONGNAM" collector/app/src/main/java
       grep -R "YEONGCHEON" collector/app/src/main/java
       grep -R "QUINELLA_PLACE" collector/app/src/main/java
       grep -R "INSERT OR IGNORE" collector/app/src/main/java
   - name: Build
     working-directory: collector
     run: gradle :app:assembleDebug --no-daemon
   - name: Name APK
     run: cp collector/app/build/outputs/apk/debug/app-debug.apk PEGASUS-HIST-5Y-COLLECTOR-v1.0.0.apk
   - uses: actions/upload-artifact@v4
     with: {name: PEGASUS-HIST-5Y-COLLECTOR-v1.0.0, path: PEGASUS-HIST-5Y-COLLECTOR-v1.0.0.apk}
